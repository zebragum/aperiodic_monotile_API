[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectre-patch-api"
version = "1.0.0"
description = "Tier-1 hosted API and worker: Spectre / Tile(1,1) patches, masks, SVG/CSV/STL export"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Spectre Patch API maintainers" }]
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "uvicorn[standard]>=0.32.0,<1.0",
  "pydantic>=2.9.0,<3.0",
  "pydantic-settings>=2.6.0,<3.0",
  "python-multipart>=0.0.12",
  "numpy>=2.0.0,<3.0",
  "shapely>=2.0.0,<3.0",
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
  "slowapi>=0.1.9",
  "triangle>=20200424",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "hypothesis>=6.115.0",
  "ruff>=0.8.0",
  "httpx>=0.27.0",
  "pip-audit>=2.7.0",
  "cairosvg>=2.7.0",
  "Pillow>=10.0.0",
]
png = [
  "cairosvg>=2.7.0",
  "Pillow>=10.0.0",
]
gltf = [
  "pygltflib>=1.16.2",
]
worker = [
  "psutil>=5.9.0",
]

[project.scripts]
spectre-patch-srv = "spectre_patch.cli:main"
spectre-patch-worker = "spectre_patch.jobs.worker:main"
spectre-patch-gc = "spectre_patch.jobs.gc:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spectre_patch"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
