services:
  - type: web
    runtime: docker
    name: aperiodic-monotile-api
    repo: https://github.com/zebragum/aperiodic_monotile_API.git
    branch: main
    plan: pro
    region: oregon
    dockerCommand: /usr/bin/tini -- /app/entrypoint.sh api-worker
    healthCheckPath: /healthz
    disk:
      name: spectre-data
      mountPath: /app/data
      sizeGB: 64
    envVars:
      - key: SPECTRE_PATCH_API_SECRET
        generateValue: true
      - key: SPECTRE_PATCH_REQUIRE_API_KEY
        value: "true"
      - key: SPECTRE_PATCH_RUN_JOBS_IN_PROCESS
        value: "false"
      - key: SPECTRE_PATCH_BOOTSTRAP_ATLAS
        value: "true"
      - key: SPECTRE_PATCH_DB_PATH
        value: /app/data/monotile.db
      - key: SPECTRE_PATCH_STORAGE_DIR
        value: /app/data/jobs
      - key: SPECTRE_PATCH_ATLAS_DIR
        value: /app/data/atlas
      - key: SPECTRE_PATCH_ATLAS_RELEASE_URL
        value: https://github.com/zebragum/aperiodic_monotile_API/releases/download/atlas-v1
      - key: SPECTRE_PATCH_RATE_LIMIT_POST_PATCH
        value: 30/minute
      - key: SPECTRE_PATCH_RATE_LIMIT_BILLING_CHECKOUT
        value: 10/minute
      - key: SPECTRE_PATCH_RATE_LIMIT_BILLING_CLAIM
        value: 20/minute
      - key: SPECTRE_PATCH_RATE_LIMIT_LEADS
        value: 10/minute
      - key: SPECTRE_PATCH_MAX_OUTPUT_BYTES_SOFT
        value: "32212254719"
      - key: SPECTRE_PATCH_CORS_ALLOW_ORIGINS
        value: https://aperiodicgenerator.com,https://www.aperiodicgenerator.com,https://aperiodic-monotile-site.onrender.com
      - key: SPECTRE_PATCH_LOG_LEVEL
        value: info
      - key: UVICORN_WORKERS
        value: "1"
      - key: SPECTRE_PATCH_WORKER_COUNT
        value: "2"
      - key: SPECTRE_PATCH_REQUIRE_ATLAS
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SPECTRE_PATCH_QUEUE_MAX_ACTIVE_JOBS
        value: "2000"
      - key: SPECTRE_PATCH_QUEUE_MAX_ACTIVE_JOBS_PER_KEY
        value: "100"
      - key: SPECTRE_PATCH_QUEUE_MAX_HEAVY_JOBS
        value: "300"
      - key: SPECTRE_PATCH_QUEUE_MAX_HEAVY_JOBS_PER_KEY
        value: "3"
      # In-container periodic GC. The cron runs alongside API + worker because
      # Render disks attach to a single service, so a standalone cron service
      # cannot see this disk. Set to 0 to disable.
      # We default to 1-hour retention with a 15-minute sweep — short enough
      # that the disk never accumulates real load, long enough that a customer
      # can re-fetch artifacts after a minor pipeline hiccup.
      - key: SPECTRE_PATCH_GC_INTERVAL_SEC
        value: "900"
      - key: SPECTRE_PATCH_GC_OLDER_THAN_HOURS
        value: "1"
      - key: SPECTRE_PATCH_GC_FIRST_DELAY_SEC
        value: "300"
      # Signed download URL TTL must stay <= GC retention or we hand out URLs
      # that 404 after the next sweep. Operators can lengthen this temporarily
      # when debugging a customer issue.
      - key: SPECTRE_PATCH_DOWNLOAD_TTL_SECONDS_MAX
        value: "3600"
      # Support contact surfaced in error envelopes and bug reports. Override
      # to point at a Linear/Sentry/email intake if you wire one up.
      - key: SPECTRE_PATCH_SUPPORT_BUG_REPORT_URL
        value: https://aperiodicgenerator.com/contact.html
      # Set this in the Render Dashboard after deploy:
      # {"free_xxx":"tier_free","day_xxx":"tier_day_pass","solo_xxx":"tier_solo","teams_xxx":"tier_teams"}
      - key: SPECTRE_PATCH_API_KEY_TIERS_JSON
        sync: false
      # Private lead export token for GET /v1/admin/leads.
      - key: SPECTRE_PATCH_ADMIN_TOKEN
        sync: false
      # Optional: set these when Stripe products are ready.
      - key: SPECTRE_PATCH_PUBLIC_SITE_URL
        value: https://aperiodicgenerator.com
      - key: SPECTRE_PATCH_STRIPE_SECRET_KEY
        sync: false
      # Optional Stripe (set after creating Products → Prices):
      # - SPECTRE_PATCH_STRIPE_PRICE_ID_SOLO_MONTHLY ($10/month)
      # - SPECTRE_PATCH_STRIPE_PRICE_ID_LIFETIME ($79 Solo lifetime)
      # - SPECTRE_PATCH_STRIPE_PRICE_ID_TEAMS_MONTHLY ($99/month Pro)
      # - SPECTRE_PATCH_STRIPE_PRICE_ID_TEAMS_YEARLY ($999 Pro lifetime)
      # Legacy Solo monthly fallback: SPECTRE_PATCH_STRIPE_PRICE_ID_STUDIO
      - key: SPECTRE_PATCH_STRIPE_PRICE_ID_DAY_PASS
        sync: false
      - key: SPECTRE_PATCH_STRIPE_PRICE_ID_SOLO_MONTHLY
        sync: false
      - key: SPECTRE_PATCH_STRIPE_PRICE_ID_SOLO_YEARLY
        sync: false
      - key: SPECTRE_PATCH_STRIPE_PRICE_ID_LIFETIME
        sync: false
      - key: SPECTRE_PATCH_STRIPE_PRICE_ID_TEAMS_MONTHLY
        sync: false
      - key: SPECTRE_PATCH_STRIPE_PRICE_ID_TEAMS_YEARLY
        sync: false
      - key: SPECTRE_PATCH_STRIPE_PRICE_ID_STUDIO
        sync: false
      - key: SPECTRE_PATCH_STRIPE_WEBHOOK_SECRET
        sync: false
