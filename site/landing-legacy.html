<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://aperiodicgenerator.com/demo.html" />
    <script>
      (function () {
        var hash = (location.hash || "").toLowerCase();
        if (hash === "#pricing") {
          location.replace("/pricing.html");
          return;
        }
        location.replace("/demo.html" + location.search + location.hash);
      })();
    </script>
    <meta http-equiv="refresh" content="0;url=/demo.html" />
  </head>
  <body>
    <p>Moved to <a href="/demo.html">demo.html</a>. Pricing is at <a href="/pricing.html">pricing.html</a>.</p>
  </body>
</html>
