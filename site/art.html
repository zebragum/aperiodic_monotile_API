  <body class="art-page">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Untiling home">
        <img class="brand-mark" src="assets/brand-mark.svg" alt="" width="32" height="32" decoding="async" />
        <span>Untiling</span>
      </a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="art.html" aria-current="page">Art</a>
        <a href="research/index.html">Research</a>
        <a class="nav-generator" href="https://aperiodicgenerator.com/">Generator</a>
        <a href="apparel/">Shop</a>
        <a href="https://www.instagram.com/aperiodicmonotiles/">Instagram</a>
      </nav>
    </header>

    <main class="art-main">
      <header class="art-intro">
        <h1>Art</h1>
      </header>

      <div class="art-grid" aria-label="Art showcase">
        <figure class="art-item art-item--wide">
          <video autoplay muted loop playsinline preload="metadata" poster="assets/art/emerald-loop.jpg" aria-label="Emerald zellige loop">
            <source src="assets/art/emerald-loop.mp4" type="video/mp4" />
          </video>
        </figure>

        <figure class="art-item">
          <img src="assets/art/philodendron.png" alt="Plant on emerald monotile floor" width="1024" height="1024" loading="lazy" decoding="async" />
        </figure>
        <figure class="art-item">
          <img src="assets/art/moss-garden.png" alt="Succulent on sandy monotile floor" width="1024" height="1024" loading="lazy" decoding="async" />
        </figure>

        <figure class="art-item art-item--wide">
          <video autoplay muted loop playsinline preload="metadata" poster="assets/art/bigfield.jpg" aria-label="Curvy monotile big field">
            <source src="assets/art/bigfield.mp4" type="video/mp4" />
          </video>
        </figure>

        <figure class="art-item art-item--wide">
          <video autoplay muted loop playsinline preload="metadata" poster="assets/art/color-field.jpg" aria-label="Color field monotile">
            <source src="assets/art/color-field.mp4" type="video/mp4" />
          </video>
        </figure>
        <figure class="art-item art-item--wide">
          <video autoplay muted loop playsinline preload="metadata" poster="assets/art/color-zoom.jpg" aria-label="Color field zoom">
            <source src="assets/art/color-zoom.mp4" type="video/mp4" />
          </video>
        </figure>

        <figure class="art-item">
          <img src="assets/art/color-field-still.png" alt="Flat color hat tiling" width="1200" height="1200" loading="lazy" decoding="async" />
        </figure>
        <figure class="art-item">
          <img src="assets/art/dragon-walk.png" alt="Crystal dragon on monotile ground" width="1024" height="1024" loading="lazy" decoding="async" />
        </figure>

        <figure class="art-item art-item--wide">
          <video autoplay muted loop playsinline preload="metadata" poster="assets/art/brass-horizon.jpg" aria-label="Brass horizon walk">
            <source src="assets/art/brass-horizon.mp4" type="video/mp4" />
          </video>
        </figure>

        <figure class="art-item">
          <img src="assets/art/sunset-terracotta.png" alt="Sunset over terracotta monotile ground" width="1200" height="675" loading="lazy" decoding="async" />
        </figure>
        <figure class="art-item">
          <img src="assets/art/natural-field.png" alt="Green monotile landscape" width="1200" height="675" loading="lazy" decoding="async" />
        </figure>

        <figure class="art-item art-item--wide">
          <video autoplay muted loop playsinline preload="metadata" poster="assets/art/rainbow-ripple.jpg" aria-label="Rainbow ripple">
            <source src="assets/art/rainbow-ripple.mp4" type="video/mp4" />
          </video>
        </figure>

        <figure class="art-item">
          <img src="assets/art/duck-chair.png" alt="Duck on a chair over monotile ground" width="1024" height="1024" loading="lazy" decoding="async" />
        </figure>
        <figure class="art-item">
          <img src="assets/art/hill-orbit.png" alt="Curvy monotile hills" width="1024" height="1024" loading="lazy" decoding="async" />
        </figure>

        <figure class="art-item art-item--wide">
          <video autoplay muted loop playsinline preload="metadata" poster="assets/art/banana.jpg" aria-label="Banana on monotile surface">
            <source src="assets/art/banana.mp4" type="video/mp4" />
          </video>
        </figure>
      </div>
    </main>

    <footer class="footer">
      <p>
